<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Clicker Kingdom</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #7ec8f5; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2b2140; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; cursor: pointer; }
  .hud { position: fixed; pointer-events: none; }
  #gold { top: max(10px, env(safe-area-inset-top)); text-align: center; font-weight: 900; font-size: 34px; color: #fff; text-shadow: 0 3px 0 #b3741b, 0 5px 10px #0005; transition: transform .08s; }
  #gold small { display: block; font-size: 14px; font-weight: 700; text-shadow: 0 1px 3px #0008; }
  #givers { top: calc(max(10px, env(safe-area-inset-top)) + 4px); left: 12px; font-size: 13px; min-width: 150px; padding: 8px 10px; border-radius: 12px; background: #ffffffcc; box-shadow: 0 2px 8px #0002; }
  #givers b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #8a6d1d; }
  #givers div { display: flex; justify-content: space-between; gap: 12px; }
  #givers .me { font-weight: 800; color: #b3741b; }
  #net { left: 12px; bottom: max(8px, env(safe-area-inset-bottom)); font-size: 12px; color: #fff; text-shadow: 0 1px 3px #000a; }
  #saved { left: 12px; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 18px); font-size: 12px; color: #fff; text-shadow: 0 1px 3px #000a; opacity: 0; transition: opacity .5s; }
  #saved.on { opacity: .9; }
  #hint { left: 0; right: 0; text-align: center; font-size: 18px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px #0009; transition: opacity .8s; }
  #toast { left: 16px; right: 16px; text-align: center; font-size: 17px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px #000b; opacity: 0; transition: opacity .4s; }
  #toast.on { opacity: 1; }
  #shop { position: fixed; right: 0; top: 0; bottom: 0; width: 300px; overflow-y: auto; touch-action: pan-y; background: #fff8e8; box-shadow: -4px 0 16px #0003; padding: max(10px, env(safe-area-inset-top)) 10px 10px; box-sizing: border-box; }
  #shop h3 { margin: 6px 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #8a6d1d; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; margin: 0 0 6px; padding: 6px 10px; border: 2px solid #e6d3a3; border-radius: 12px; background: #fff; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .item:active { transform: scale(.97); }
  .item .ic { font-size: 26px; width: 32px; text-align: center; }
  .item .tx { flex: 1; line-height: 1.2; }
  .item .tx small { display: block; color: #7a6a52; font-size: 12px; }
  .item .cost { font-weight: 800; color: #b3741b; white-space: nowrap; }
  .item .own { font-weight: 900; font-size: 20px; color: #c9b27a; min-width: 26px; text-align: right; }
  .item.poor { opacity: .45; }
  .item[hidden] { display: none; }

  #ups .item { width: auto; flex: 1 1 120px; margin: 0; }
  #boardBtn { position: fixed; top: max(10px, env(safe-area-inset-top)); right: 312px; width: 44px; height: 44px; border-radius: 12px; border: 0; background: #ffffffcc; font-size: 20px; cursor: pointer; box-shadow: 0 2px 8px #0002; }
  @media (max-width: 759px) {
    #shop { top: auto; left: 0; width: auto; height: min(42vh, 360px); padding-bottom: max(10px, env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0; box-shadow: 0 -4px 16px #0003; }
    #boardBtn { right: 10px; }
    #givers { display: none; }
    #net { bottom: auto; top: calc(max(10px, env(safe-area-inset-top)) + 84px); left: 50%; transform: translateX(-50%); white-space: nowrap; }
    #saved { bottom: auto; top: calc(max(10px, env(safe-area-inset-top)) + 102px); left: 50%; transform: translateX(-50%); }
  }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #2b214099; }
  #over[hidden] { display: none; }
  .card { width: min(340px, 88vw); padding: 22px; border-radius: 16px; background: #fff8e8; text-align: center; box-shadow: 0 10px 30px #0005; }
  .card h2 { margin: 0 0 4px; font-size: 24px; }
  .card ol { text-align: left; margin: 14px 0; padding-left: 26px; font-size: 14px; min-height: 40px; }
  .card li span { float: right; font-weight: 700; color: #b3741b; }
  button.go { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #f2b630; color: #3a2400; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .attract #shop, .attract #givers, .attract #net, .attract #boardBtn, .attract #hint, .attract #saved { display: none !important; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="gold">0<small>&nbsp;</small></div>
<div class="hud" id="givers"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="saved">✓ Kingdom saved</div>
<div class="hud" id="net">Connecting…</div>
<button id="boardBtn" title="Top contributors">🏆</button>
<div id="shop"><h3>Upgrades</h3><div id="ups"></div><h3>Buildings</h3><div id="builds"></div></div>
<div id="over" hidden>
  <div class="card">
    <h2>Top contributors</h2>
    <div id="mine"></div>
    <ol id="board"><li>Loading the leaderboard…</li></ol>
    <button class="go" id="back">Back to the kingdom</button>
  </div>
</div>
<script>
/* ═══ CLICKER KINGDOM · a Multiplayer Agent starter ═══════════════════════════════════
 * Everyone grows one kingdom together. Drop-in, 2–30 players; bot helpers click and buy.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ clicks, prices, bots, and the BUILDINGS / UPGRADES / TIERS lists
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   WORLD MEMORY .. how the kingdom survives the room emptying (same code in every starter)
 *   KINGDOM ....... prices and income worked out from state (everyone uses these)
 *   KINGDOM (HOST)  counting clicks, checking purchases, income, bots, writing `kingdom`
 *   ME ............ clicking: floating numbers, coins, sending clicks in batches
 *   DRAW .......... sky, hills, the castle and every building, effects
 *   HUD & BOARD ... gold, shop, top givers, toasts, leaderboard card
 *   INPUT ......... click/tap the kingdom, Space to click
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `hb` (heartbeat) once a second and `n`/`h`
 *     (name, color) once. That's all: the kingdom itself belongs to the host.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last
 *     3s), worked out every frame. Only the host writes the shared field `kingdom` (one
 *     JSON: rev, gold, earned, buildings, upgrades, and the top givers) 4 times a second.
 *     A new host adopts it from state and carries on.
 *   - Everyone else sends intents: "click" {n} (clicks batched about twice a second) and
 *     "buy" {k} (a building or upgrade). The host checks the price and applies it.
 *     "built" {k, n} is an event just for the toast; the new building is in state.
 *   - The kingdom outlives the room through WORLD MEMORY (see that section), and its
 *     buildings keep earning while nobody is there.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "gold-given": gold each player has given through clicks, all time.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  name: "Clickshire",        // the kingdom's name
  batchMs: 500,              // your clicks go to the host in batches this often (about 2 a second)
  maxClicksPerBatch: 15,     // the host ignores clicks beyond this per batch (30 a second)
  clickGpsShare: 0.02,       // each click also gives this share of the gold-per-second
  costGrowth: 1.15,          // each building costs this much more than the last of its kind
  awayRate: 0.5,             // share of the income earned while the room was empty
  awayCapHours: 8,           // ...for at most this long
  seats: 4,                  // bot helpers fill the kingdom up to this many players
  botClicks: [2, 5],         // a bot clicks between this many times a second
  botShopMs: 6000,           // ms between bot shopping trips
  board: "gold-given",       // leaderboard name
  saveNs: "clicker-kingdom", // player-save namespace for world memory
  saveEvery: 10000,          // ms between world-memory saves
};
const BUILDINGS = [ // gps = gold per second each
  { k: "farm", name: "Farm", icon: "🌾", cost: 15, gps: 0.5 },
  { k: "mill", name: "Windmill", icon: "🌀", cost: 120, gps: 3 },
  { k: "mine", name: "Mine", icon: "⛏️", cost: 900, gps: 15 },
  { k: "market", name: "Market", icon: "🎪", cost: 6000, gps: 70 },
  { k: "tower", name: "Wizard tower", icon: "🔮", cost: 40000, gps: 400 },
  { k: "dragon", name: "Dragon roost", icon: "🐉", cost: 300000, gps: 2500 },
];
const UPGRADES = [ // click: clicks ×; k + mult: one building ×; all: everything ×
  { id: "gloves", name: "Golden gloves", icon: "🧤", cost: 100, desc: "Clicks ×2", click: 2 },
  { id: "plows", name: "Iron plows", icon: "🔧", cost: 600, desc: "Farms ×2", k: "farm", mult: 2 },
  { id: "sails", name: "Silk sails", icon: "⛵", cost: 3000, desc: "Windmills ×2", k: "mill", mult: 2 },
  { id: "carts", name: "Mine carts", icon: "🛒", cost: 15000, desc: "Mines ×2", k: "mine", mult: 2 },
  { id: "crown", name: "Royal decree", icon: "👑", cost: 40000, desc: "Clicks ×5", click: 5 },
  { id: "guild", name: "Merchant guild", icon: "⚖️", cost: 120000, desc: "Markets ×2", k: "market", mult: 2 },
  { id: "feast", name: "Grand feast", icon: "🍗", cost: 500000, desc: "Everything ×1.5", all: 1.5 },
];
const TIERS = [[0, "Hamlet"], [300, "Village"], [3000, "Town"], [30000, "City"], [300000, "Kingdom"], [3000000, "Empire"]]; // by gold earned
const BOTS = [ // bot helpers, in the order they join
  { name: "Sir Clicksalot", color: "#5b8def" }, { name: "Lady Penny", color: "#e0569b" },
  { name: "Baron Goldbeard", color: "#3fb27f" }, { name: "Dame Tapworth", color: "#9b6bd6" },
  { name: "Old Farmer Bo", color: "#e0843a" }, { name: "Squire Tim", color: "#20a4b8" },
];
const COLORS = ["#e94f4f", "#3d8bfd", "#f2a516", "#2fbf71", "#a25ddc", "#ff7a3d", "#14b8c4", "#ec4899"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'clicker-kingdom',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}

async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const join = MP.join({ ...MP_CONNECT });
    const mp = await Promise.race([join, new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}

const parse = (v, fallback) => { if (typeof v !== "string") return fallback; try { return JSON.parse(v); } catch { return fallback; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback, map = (v) => v) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = map(parse(raw, fallback)); memo.set(key, { raw, v }); return v;
}
let net = null;      // the room client (real or local)
let player = null;   // MP.auth client: leaderboard and world-memory saves (null offline)
let S = { entities: { players: {} }, shared: {} }; // latest state
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock

/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── WORLD MEMORY ────────────────────────────────────────────────────────────────────
// A relay room forgets everything when its last player leaves, so the PLAYERS remember the world:
//   1. Every CONFIG.saveEvery ms and when the page closes, each player saves a copy of the live
//      world with its `rev` (how many changes PEOPLE made; bots don't count, so a fresh world
//      full of bot builds never beats a saved one) to its player save (player.data, namespace
//      CONFIG.saveNs) and to this browser (localStorage). A copy with a higher rev than the live
//      world is never overwritten: it is kept and offered.
//   2. The first player into an empty room becomes host and loads its copy into shared.
//   3. A player who joins holding a copy with a HIGHER rev than the live world offers it: it
//      writes the copy into its own entity (`wmh` header, `wm0`, `wm1`… chunks under 2048
//      characters) and the host adopts it. The copy with more building in it wins; changes
//      made only in the other copy are lost.
// The game supplies worldSnapshot(), liveRev() (-1 = no world yet) and loadWorld(world, rev).
const memory = { saved: null, ready: false, cloud: null, lastJson: "", lastSave: 0, offerRev: 0, offerN: 0 };
const memoryKey = () => "mpa-world:" + MP_CONNECT.room + (net.offline ? ":offline" : "");

/** Read my copy: this browser's and my cloud save, whichever has the higher rev. */
async function loadMemory() {
  let best = null;
  try { best = JSON.parse(localStorage.getItem(memoryKey()) || "null"); } catch {}
  if (player) {
    try {
      const doc = (await player.data.get(CONFIG.saveNs)).data;
      if (doc && doc.room === MP_CONNECT.room && doc.world && (!best || doc.rev > best.rev)) best = doc;
      memory.cloud = true;
    } catch (e) { memory.cloud = false; console.warn("World memory: no cloud save, this browser only:", e && e.message); }
  }
  memory.saved = best && best.room === MP_CONNECT.room && best.world && typeof best.rev === "number" ? best : null;
  memory.lastJson = memory.saved ? JSON.stringify(memory.saved.world) : "";
  memory.ready = true;
}

/** Save my copy of the live world, unless it is unchanged or older than the copy I hold. */
function rememberWorld() {
  if (ATTRACT || !memory.ready) return;
  const rev = liveRev();
  if (rev < 0 || (memory.saved && rev < memory.saved.rev)) return; // mine is newer: keep it, keep offering it
  const doc = { room: MP_CONNECT.room, rev, at: Date.now(), world: worldSnapshot() };
  const json = JSON.stringify(doc.world);
  if (json === memory.lastJson) return;
  memory.lastJson = json; memory.saved = doc;
  try { localStorage.setItem(memoryKey(), JSON.stringify(doc)); } catch {}
  if (player && memory.cloud) {
    player.data.set(doc, { namespace: CONFIG.saveNs })
      .catch((e) => e && e.current ? player.data.set(doc, { namespace: CONFIG.saveNs, version: e.current.version }) : Promise.reject(e))
      .catch((e) => { if (e && (e.status === 401 || e.status === 403)) memory.cloud = false; });
  }
  const tag = document.getElementById("saved");
  if (tag) { tag.classList.add("on"); setTimeout(() => tag.classList.remove("on"), 1600); }
}

/** Once a second: offer my copy if it beats the live world (the host simply loads it). */
function offerMemory() {
  if (ATTRACT || !memory.ready) return;
  const mine = memory.saved, live = liveRev(), better = mine && mine.rev > live;
  if (isHost()) {
    if (memory.offerRev) clearOffer();
    if (better && live >= 0 && loadWorld(mine.world, mine.rev)) memoryAdopted("");
    return;
  }
  if (better && memory.offerRev !== mine.rev) {
    const json = JSON.stringify(mine.world), fields = {}, n = Math.ceil(json.length / 1900);
    if (n > 40) return; // too big for my entity: keep it for when I am host
    for (let i = 0; i < n; i++) fields["wm" + i] = "~" + json.slice(i * 1900, (i + 1) * 1900); // "~" keeps it a string
    net.me.set(fields);
    net.me.set("wmh", JSON.stringify({ room: MP_CONNECT.room, rev: mine.rev, n })); // header last: chunks land first
    memory.offerRev = mine.rev; memory.offerN = n;
  } else if (!better && memory.offerRev) clearOffer();
}
function clearOffer() {
  const fields = { wmh: "" };
  for (let i = 0; i < memory.offerN; i++) fields["wm" + i] = "";
  net.me.set(fields); memory.offerRev = 0; memory.offerN = 0;
}

/** Host, once a second: adopt the best complete offer that beats the live world. */
function adoptOffers() {
  let best = null;
  for (const id of livePlayers()) {
    const p = S.entities.players[id], h = id !== net.sessionId && parse(p && p.wmh, null);
    if (!h || h.room !== MP_CONNECT.room || !(h.n <= 40) || !(h.rev > liveRev()) || (best && h.rev <= best.rev)) continue;
    let json = "";
    for (let i = 0; i < h.n && json !== null; i++) { const c = p["wm" + i]; json = typeof c === "string" && c[0] === "~" ? json + c.slice(1) : null; }
    const world = parse(json, null);
    if (world) best = { rev: h.rev, world, name: p.n || "A player" };
  }
  if (best && loadWorld(best.world, best.rev)) memoryAdopted(best.name);
}
function memoryAdopted(name) {
  const text = name ? `${name} brought back the world they saved` : "Welcome back: your saved world is loaded";
  toast(text); net.send("memory", { text: name ? text : "The host brought back the world they saved" });
}
function memoryTick() {
  offerMemory();
  if (isHost() && !ATTRACT) adoptOffers();
  if (performance.now() - memory.lastSave > CONFIG.saveEvery) { memory.lastSave = performance.now(); rememberWorld(); }
}
addEventListener("pagehide", () => rememberWorld());
document.addEventListener("visibilitychange", () => { if (document.hidden) rememberWorld(); });

// ── KINGDOM ─────────────────────────────────────────────────────────────────────────
// A kingdom is { rev, gold, earned, b: { farm: 3, … }, u: ["gloves", …], crowd: [[name, gold, color], …] }.
const countOf = (k, v) => (v.b && v.b[k]) || 0;
const costOf = (bd, v) => Math.ceil(bd.cost * Math.pow(CONFIG.costGrowth, countOf(bd.k, v)));
function multOf(k, v) { let m = 1; for (const up of UPGRADES) if (v.u.includes(up.id)) m *= up.k === k ? up.mult : up.all || 1; return m; }
const gpsOf = (v) => BUILDINGS.reduce((s, bd) => s + countOf(bd.k, v) * bd.gps * multOf(bd.k, v), 0);
const clickOf = (v) => UPGRADES.reduce((m, up) => (v.u.includes(up.id) && up.click ? m * up.click : m), 1) * (1 + gpsOf(v) * CONFIG.clickGpsShare);
const tierOf = (v) => TIERS.filter(([at]) => v.earned >= at).length - 1;
const EMPTY = { rev: -1, gold: 0, earned: 0, b: {}, u: [], crowd: [] };
/** A kingdom from the wire or a save, checked field by field. */
function cleanKingdom(k) {
  if (!k || typeof k !== "object") return null;
  const num = (v) => (Number.isFinite(v) && v >= 0 ? v : 0), b = {};
  for (const bd of BUILDINGS) b[bd.k] = Math.min(100000, Math.floor(num(k.b && k.b[bd.k])));
  return {
    rev: Number.isFinite(k.rev) ? k.rev : 0, gold: num(k.gold), earned: num(k.earned), b,
    u: Array.isArray(k.u) ? UPGRADES.filter((up) => k.u.includes(up.id)).map((up) => up.id) : [],
    crowd: Array.isArray(k.crowd) ? k.crowd.filter((c) => Array.isArray(c) && typeof c[0] === "string").slice(0, 20).map((c) => [c[0].slice(0, 24), num(c[1]), typeof c[2] === "string" ? c[2] : "#888"]) : [],
    t: Number.isFinite(k.t) ? k.t : 0,
  };
}
/** The kingdom everyone draws: the host's own copy, or the shared field. */
function kingdom() {
  if (isHost() && kd.adopted) return kd.view;
  return shared("kingdom", null, cleanKingdom) || EMPTY;
}

// ── KINGDOM (HOST) ──────────────────────────────────────────────────────────────────
const kd = { adopted: false, rev: 0, gold: 0, earned: 0, b: {}, u: [], crowd: new Map(), view: EMPTY, lastWrite: 0, lastBots: 0, lastShop: 0 };
let startedAt = 0;
function setKingdom(k) { // install a clean kingdom as the host's own
  Object.assign(kd, { adopted: true, rev: k.rev, gold: k.gold, earned: k.earned, b: { ...k.b }, u: [...k.u], crowd: new Map(k.crowd.map(([n, g, c]) => [n, { g, c }])) });
  refreshView();
}
function refreshView() {
  const crowd = [...kd.crowd].sort((a, b) => b[1].g - a[1].g).slice(0, 20).map(([n, { g, c }]) => [n, Math.floor(g), c]);
  kd.view = { rev: kd.rev, gold: Math.floor(kd.gold), earned: Math.floor(kd.earned), b: kd.b, u: kd.u, crowd };
}
/** World memory: install a saved kingdom, plus what its buildings earned while nobody was here. */
function loadWorld(snap, rev) {
  const k = cleanKingdom(snap);
  if (!k || typeof rev !== "number") return false;
  setKingdom({ ...k, rev });
  const away = Math.min(CONFIG.awayCapHours * 3600, Math.max(0, (Date.now() - k.t) / 1000)), bonus = k.t ? gpsOf(kd) * away * CONFIG.awayRate : 0;
  if (bonus >= 1) { kd.gold += bonus; kd.earned += bonus; refreshView(); const text = `While everyone was away, ${CONFIG.name} earned ${fmt(bonus)} gold`; setTimeout(() => toast(text), 3600); net.send("toast", { text }); }
  return true;
}
function worldSnapshot() { const k = kingdom(); return { gold: k.gold, earned: k.earned, b: k.b, u: k.u, crowd: k.crowd, t: Date.now() }; }

}

}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); if (e.clientY < SH && e.clientX < SW) tap(e.clientX, e.clientY); });
addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat) { e.preventDefault(); tap(SW / 2, ground() - unit()); } });
cv.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastScore = 0, autoAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick(dt, now); else kd.adopted = false;
  if (ATTRACT && now > autoAt) { autoAt = now + 110 + Math.random() * 120; const u = unit(); tap(SW / 2 + (Math.random() - 0.5) * u * 2, ground() - u * (0.4 + Math.random())); } // the preview's autopilot
  sendClicks(now);
  watchKingdom(kingdom(), now);
  draw(now, dt);
  hud(dt, now);
  if (now - lastScore > 20000) { lastScore = now; sendScore(); }
  requestAnimationFrame(frame);
}

(async function start() {
  document.body.classList.toggle("attract", ATTRACT);
  if (ATTRACT) $("net").textContent = "";
  fit(); buildShop();
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("click", (msg, from) => { if (isHost()) applyClicks(from, msg, true); });
  net.on("buy", (msg, from) => { if (isHost()) applyBuy(from, msg, true); });
  net.on("built", (msg) => { if (msg && typeof msg.n === "string") showBuilt(msg); });
  net.on("toast", (msg) => { if (msg && typeof msg.text === "string") setTimeout(() => toast(msg.text.slice(0, 90)), 3600); });
  net.on("memory", (m) => { if (m && typeof m.text === "string") toast(m.text.slice(0, 80)); });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") { player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board); }
  me.name = (() => { try { return localStorage.getItem("mpa-name") || ""; } catch { return ""; } })() ||
    ["Merry", "Brave", "Lucky", "Jolly", "Clever", "Royal"][Math.floor(Math.random() * 6)] + " " + ["Baker", "Knight", "Miner", "Jester", "Farmer", "Bard"][Math.floor(Math.random() * 6)];
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.h));
  me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: me.name, h: me.color, hb: Date.now() });
  addEventListener("pagehide", sendScore);
  startedAt = performance.now();
  if (ATTRACT) { // a busy kingdom, buying fast
    memory.ready = true; CONFIG.seats = 6; CONFIG.botClicks = [6, 10]; CONFIG.botShopMs = 700;
    setKingdom({ ...EMPTY, rev: 0, gold: 30000, earned: 60000, b: { farm: 5, mill: 3, mine: 2, market: 1 }, u: ["gloves", "plows"] });
  } else {
    loadMemory();
    me.hint = true; $("hint").textContent = "Click the kingdom to make gold!";
  }
  setInterval(memoryTick, 1000);
  requestAnimationFrame(frame);
})();
</script>
